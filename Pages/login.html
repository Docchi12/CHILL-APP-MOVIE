<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../Images/logo-tab-address.png" />
    <link rel="stylesheet" href="../Style/authentication.css" />
    <title>Login - Chill App</title>
  </head>
  <body>
    <main>
      <img class="logo" src="../Images/Logo-login.png" alt="Chill App Logo" />
      <div class="header">
        <h1>Masuk</h1>
        <p>Selamat datang kembali!</p>
      </div>
      <form action="" method="post">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            name="username"
            id="username"
            placeholder="Masukkan username"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">Kata sandi</label>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Masukkan kata sandi"
            required
          />
          <img src="../Images/eye-off.png" alt="eye-icon" />
          <div class="auth-action">
            <p>Belum punya akun? <a href="./register.html">Daftar</a></p>
            <p><a href="#">Lupa kata sandi?</a></p>
          </div>
        </div>
        <div class="form-action">
          <button type="submit">Masuk</button>
          <p>Atau</p>
          <button type="button">
            <img src="../Images/google-icon.png" alt="google icon" />
            Masuk dengan Google
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
