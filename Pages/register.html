<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../Images/logo-tab-address.svg" />
    <link rel="stylesheet" href="../Style/authentication.css" />
    <title>Register - Chill App</title>
  </head>
  <body>
    <main>
      <img class="logo" src="../Images/Logo.svg" alt="Chill App Logo" />
      <div class="header">
        <h1>Daftar</h1>
        <p>Selamat datang!</p>
      </div>
      <form action="" method="post">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            name="username"
            id="username"
            placeholder="Masukkan username"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">Kata sandi</label>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Masukkan kata sandi"
            required
          />
          <img src="../Images/eye-off.svg" alt="eye-icon" />
        </div>
        <div class="form-group">
          <label for="confirm-password">Konfirmasi kata sandi</label>
          <input
            type="password"
            name="confirm-password"
            id="confirm-password"
            placeholder="Masukkan kata sandi"
            required
          />
          <img src="../Images/eye-off.svg" alt="eye-icon" />
          <div class="auth-action">
            <p>Sudah punya akun? <a href="./login.html">Masuk</a></p>
          </div>
        </div>
        <div class="form-action">
          <button type="submit">Daftar</button>
          <p>Atau</p>
          <button type="button">
            <img src="../Images/google-icon.svg" alt="google icon" />
            Daftar dengan Google
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
